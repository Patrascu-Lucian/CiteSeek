# Native postinstall scripts are opt-in under pnpm 11. These are all first-party
# to the stack, so they are approved rather than ignored:
#   sharp         -> Next.js image optimization, which the landing page's
#                    screenshots now use — so it is invoked, on our own files.
#   unrs-resolver -> native module resolver used by eslint-config-next's import plugin
#   esbuild       -> bundler used by drizzle-kit to run TS config and migrations
#   onnxruntime-node, protobufjs -> denied. Both ship prebuilt binaries, so the
#   install script compiles nothing we need; denying it skips a postinstall
#   rather than the package. Node scripts still load it — the browser does not,
#   and that is the path local mode ships on.
#
#   **onnxruntime-node: false is also the mitigation for CVE-2026-76845.** Its
#   postinstall is the only caller of adm-zip, which has no patched release, and
#   the advisory's precondition is a planted symlink in a temp or CI directory —
#   exactly where that script extracts. Flipping this to true re-enables a
#   vulnerable path, so this line is a security decision as much as a build one.
#   `pnpm-workspace.test.ts` fails if it is allowed while that advisory is ignored.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  onnxruntime-node: false
  protobufjs: false

# Written by pnpm, not by hand: pnpm 11 holds back versions published less than
# a day ago by default, and naming one explicitly adds it here rather than
# failing. Not `minimumReleaseAge: <n>` to widen that: setting it also turns
# strict mode on, and a young version then fails CI instead of being recorded.
# `pnpm-workspace.test.ts` fails on an entry the lockfile no longer installs.
minimumReleaseAgeExclude: []

# Old copies of both are pulled in transitively alongside the current ones, and
# Dependabot cannot bump what is not in package.json — it retried and failed on
# six advisories. Both targets were already installed elsewhere in the tree, so
# this deduplicates rather than introducing anything.
overrides:
  postcss: ^8.5.25
  esbuild: ^0.28.1
  # sharp was already here via next, so this collapses two copies into one, as
  # postcss and esbuild do above. 0.35.4 is the floor rather than 0.35.3 because
  # below it sharp bundles libheif < 1.23.2 (GHSA-2jg2-4ch7-h545): AVIF decoding
  # with two critical CVEs. **That floor became load-bearing on 20 September
  # 2026**, when the landing page's screenshots started going through
  # `next/image`: sharp is invoked now. What it decodes is two PNGs committed to
  # this repository rather than anything a reader supplies, so the advisory's
  # path is not reachable from a request — but the version it decodes with is no
  # longer a precaution.
  sharp: ^0.35.4
  # Dev only — eslint and its config packages. 4.3.2 counts empty merge sources
  # against maxTotalMergeKeys; below it a small crafted document costs seconds of
  # CPU. Nothing loads untrusted YAML here; the bump is free.
  js-yaml: ^4.3.2
  # Dev only, and pinned exactly at 6.15.1 by typed-rest-client, which is why
  # Dependabot reported it unfixable: an override is the only way past an exact
  # pin. 6.15.2 is where the null guard lands in the comma + encodeValuesOnly
  # path, read from the published tarballs rather than the advisory, which names
  # both 6.15.2 and 6.16.0. Express already brings 6.16.0, so this collapses two
  # copies into one, as postcss and esbuild do above.
  qs: ^6.15.2
  # 0.6.1 clears both advisories at once, each affected up to 0.6.0:
  # GHSA-vwc7-r8mq-g2x9 (symlink-following on extract) and the declared
  # uncompressed size allocated before it is checked, where 105 bytes commit
  # 1.8 GB. Still unreachable — the only caller is onnxruntime-node's
  # postinstall, denied in allowBuilds above — so this is one copy and a floor,
  # not a fix for anything we run.
  adm-zip: ^0.6.1
