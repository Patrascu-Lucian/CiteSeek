<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CiteSeek">
  <!-- Drawn rather than set in Audiowide: next/font downloads that face into
       hashed, gitignored paths, so a generator would need a prior build. -->
  <style>
    /* `rx` in CSS, not as an attribute, so the generator can flatten it to 0. */
    .ground { fill: oklch(0.42 0.13 264); rx: 112px; }
    .mark { fill: none; stroke: oklch(0.985 0 0); stroke-width: 62; stroke-linecap: butt; }
  </style>

  <rect class="ground" width="512" height="512" />

  <!-- 270°: a wider aperture closes up at 16px and reads as an O. Nudged right
       because the ink spans x 85–386, which looks 20px left of centre. -->
  <path class="mark" transform="translate(16 0)" d="M 355 157 A 140 140 0 1 0 355 355" />
</svg>
