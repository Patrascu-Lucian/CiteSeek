name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Least privilege for `GITHUB_TOKEN`. Without this the default is whatever the
# repository setting says, which is broad and invisible from here — CodeQL flags
# every job for it. Nothing in this workflow writes to the repository; it reads
# code and reports checks.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `test:coverage` is `test` with the v8 provider attached, so this replaces
      # the plain run rather than adding a second one. Until now nothing
      # evaluated `vitest.config.ts`'s thresholds and they had been failing for
      # an unknown length of time — a bar no job checks is documentation.
      - name: Unit tests and coverage thresholds
        run: pnpm test:coverage

      # `always()`: a job past `timeout-minutes` is cancelled, and both
      # `failure()` and `!cancelled()` skip there — the hung run being the one
      # worth reading. A green report is kept too, to compare a later flake against.
      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: test-results/unit.junit.xml
          # Lint or typecheck failing means no report was ever written.
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build
        env:
          # `next build` evaluates every route module to collect page data, and
          # the auth route imports both the database client and the Auth.js
          # config. Neither opens a connection at build time, but both require
          # their variables to exist. These placeholders are deliberately
          # non-connectable and mirror how Vercel injects real values at build.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: build-time-placeholder-not-a-real-secret

      # The e2e job needs this exact build. Uploading it avoids paying for a
      # second build and guarantees both jobs test the same artifact.
      #
      # `public/onnx` too: `prebuild` vendors the ONNX runtime there and it is
      # gitignored, so a checkout alone would serve 404s for every wasm request.
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            public/onnx
          retention-days: 1
          include-hidden-files: true

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres per run, not the Neon dev database: it keeps test data
    # away from real data, costs nothing against the Neon free tier, and proves
    # the migration applies cleanly to an empty database on every PR.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeseek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeseek_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed demo workspace
        run: pnpm db:seed

      # Running it twice is the assertion that the seed is idempotent -- it is run
      # locally, in CI, and against preview databases, so a second run must be a
      # no-op rather than a duplicate or a crash.
      - name: Seed again (idempotency check)
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Upload integration test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: test-results/integration.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The guest-mode flows resolve the seeded demo workspace from the database,
    # so the E2E suite needs a real one rather than a stub.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citeseek_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citeseek_e2e
      # A real signing key is required: guest tokens are HMAC-signed and the app
      # rejects anything it cannot verify. Generated per run, never reused.
      AUTH_SECRET: e2e-only-secret-regenerated-every-run
      # No API key on CI, and none wanted: the deterministic providers exercise
      # the whole ingestion and answer path with no network and no flakiness. A
      # suite that needed a real provider would be one rate limit away from red,
      # and a non-deterministic model would make "the answer cites [1]" a
      # coin toss rather than an assertion.
      EMBEDDINGS_PROVIDER: fake
      CHAT_PROVIDER: fake

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: next-build

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed demo workspace
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      # `always()` for the reason above, and most of all here: this job boots a
      # server, installs a browser and runs 150 specs under the same cap.
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The only job that runs transformers.js for real. Everything else mocks it,
  # which is why every defect in that code was found by hand in a browser.
  model:
    name: Real local model
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Read by `nodeModelCacheDir`, so the weights land somewhere cacheable
      # rather than inside `node_modules`.
      CITESEEK_MODEL_CACHE: ${{ github.workspace }}/.model-cache

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ~31 MB from Hugging Face, once. Keyed on the model id in the test, so a
      # different model misses rather than silently reusing these weights.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-${{ hashFiles('lib/local/generate.model.test.ts') }}

      - name: Run the model tests
        run: pnpm test:model
